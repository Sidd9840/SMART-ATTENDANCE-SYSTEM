<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <link rel="stylesheet" href="../CSS/editStudent.css">

</head>

<body>

<div class="hero">

<div class="content">

<h1>Edit Student</h1>

<p>Update Student Details</p>

<form id="editStudentForm">

<input
type="text"
id="studentName"
placeholder="Student Name">

<span id="nameError" class="error"></span>

<input
type="text"
id="rollNo"
placeholder="Roll Number">

<span id="rollError" class="error"></span>

<input
type="text"
id="course"
placeholder="Course">

<span id="courseError" class="error"></span>

<input
type="email"
id="email"
placeholder="Email">

<span id="emailError" class="error"></span>

<input
type="password"
id="password"
placeholder="Password">

<span id="passwordError" class="error"></span>

<div class="buttons">

<button type="submit">

Update Student

</button>

</div>

</form>

<div class="buttons">

<button type="button" onclick="goBack()">

⬅ Back

</button>

</div>

</div>

</div>

<script src="../JS/editStudent.js"></script>

</body>

</html>
