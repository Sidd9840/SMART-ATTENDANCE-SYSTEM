<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <link rel="stylesheet" href="../CSS/style1.css">

</head>

<body>

<div class="hero">

<div class="content">

<h1>Edit Student</h1>

<p>Update Student Details</p>

<form id="editStudentForm">

<input
type="text"
id="studentName"
placeholder="Student Name"
required>

<input
type="text"
id="rollNo"
placeholder="Roll Number"
required>

<input
type="text"
id="course"
placeholder="Course"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<div class="buttons">

<button type="submit">

Update Student

</button>

</div>

</form>

<div class="buttons">

<button onclick="goBack()">

← Back

</button>

</div>

</div>

</div>

<script src="../JS/editStudent.js"></script>

</body>

</html>
