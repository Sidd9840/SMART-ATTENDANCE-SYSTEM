<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="../CSS/studentDashboard.css">
</head>
<body>

<div class="hero">

    <div class="content">

        <h1>Student Dashboard</h1>

        <div class="dashboard-cards">

            <div class="card">
                <h3>Name</h3>
                <h2 id="studentName"></h2>
            </div>

            <div class="card">
                <h3>Roll No</h3>
                <h2 id="rollNo"></h2>
            </div>

            <div class="card">
                <h3>Course</h3>
                <h2 id="course"></h2>
            </div>

            <div class="card">
                <h3>Present</h3>
                <h2 id="present">0</h2>
            </div>

            <div class="card">
                <h3>Total Classes</h3>
                <h2 id="total">0</h2>
            </div>

            <div class="card">
                <h3>Attendance %</h3>
                <h2 id="percentage">0%</h2>
            </div>

        </div>

        <div class="buttons dashboard-buttons">

    <a href="markAttendance.html">
        <button class="primary-btn">
            📍 Mark My Attendance
        </button>
    </a>

    <a href="studentAttendance.html">
        <button class="secondary-btn">
            📊 My Attendance
        </button>
    </a>

</div>

<div class="logout-section">

    <a href="../index.html">
        <button onclick="goHome()" class="home-btn">
    🏠 Home
</button>
        <button class="logout-btn">
            🚪 Logout
        </button>
    </a>

</div>

    </div>

</div>

<script src="../JS/studentDashboard.js"></script>

</body>
</html>
