<!DOCTYPE html>
<html>
<head>
    <title>Mark My Attendance</title>
    <link rel="stylesheet" href="../CSS/markAttendance.css">
</head>

<body>

<div class="hero">

<div class="content">

<h1>📍 Mark My Attendance</h1>

<div class="attendance-cards">

    <div class="card">
        <h3>Name</h3>
        <h2 id="studentName"></h2>
    </div>

    <div class="card">
        <h3>Roll No</h3>
        <h2 id="rollNo"></h2>
    </div>

    <div class="card">
        <h3>Course</h3>
        <h2 id="course"></h2>
    </div>

    <div class="card">
        <h3>Location Status</h3>
        <h2 id="locationStatus">Checking...</h2>
    </div>

    <div class="card">
        <h3>Distance</h3>
        <h2 id="distance">0 Meter</h2>
    </div>

</div>

<!-- Attendance Details -->

<div class="form-group">
    <label><b>Teacher</b></label>

    <select id="teacherId" onchange="loadTeacherSubject()">
        <option value="">Select Teacher</option>
    </select>
</div>

<div class="form-group">
    <label><b>Subject</b></label>

    <select id="subject">
        <option value="">Select Subject</option>
    </select>
</div>

<div class="form-group">
    <label><b>Lecture</b></label>

    <select id="lecture">
        <option value="">Select Lecture</option>
        <option value="Lecture 1">Lecture 1</option>
        <option value="Lecture 2">Lecture 2</option>
        <option value="Lecture 3">Lecture 3</option>
        <option value="Lecture 4">Lecture 4</option>
    </select>
</div>

<div class="form-group">
    <label><b>Class Type</b></label>

    <select id="classType">
        <option value="">Select Type</option>
        <option value="Theory">Theory</option>
        <option value="Lab">Lab</option>
    </select>
</div>

<br>

<div class="buttons">

    <button id="saveBtn" onclick="saveAttendance()">
        ✅ Mark Attendance
    </button>

</div>

<div class="buttons">

    <button onclick="goBack()">
        ⬅ Back
    </button>

</div>

</div>

</div>

<script src="../JS/markAttendance.js"></script>

</body>
</html>
