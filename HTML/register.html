<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link rel="stylesheet" href="../CSS/style1.css">

</head>

<body>

<div class="hero">

    <div class="content">

        <h1>Create Account</h1>

        <p>Register to Smart Attendance System</p>

        <div class="loginForm">

            <input
                type="text"
                id="name"
                placeholder="Enter Full Name">

            <input
                type="email"
                id="email"
                placeholder="Enter Email">

            <input
                type="password"
                id="password"
                placeholder="Enter Password">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password">

            <select id="role">

                <option value="">Select Role</option>

                <option value="Student">
                    Student
                </option>

                <option value="Teacher">
                    Teacher
                </option>

            </select>

            <button onclick="continueRegister()">

                Continue

            </button>

        </div>

        <br>

        <a href="login.html">

            Already have an account? Login

        </a>

    </div>

</div>

<script src="../JS/register.js"></script>

</body>

</html>
