<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Registration - Smart Attendance System</title>

    <link rel="stylesheet"
          href="../CSS/style.css">

</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>Admin Registration</h1>

            <p>Create Admin Account</p>

            <!-- Username -->

            <label>Username</label>

            <input type="text"
                   id="username"
                   placeholder="Enter Username">

            <span id="usernameError"
                  class="error-message"></span>


            <!-- Email -->

            <label>Email</label>

            <input type="email"
                   id="email"
                   placeholder="Enter Email">

            <span id="emailError"
                  class="error-message"></span>


            <!-- Password -->

            <label>Password</label>

            <input type="password"
                   id="password"
                   placeholder="Enter Password">

            <span id="passwordError"
                  class="error-message"></span>


            <!-- Confirm Password -->

            <label>Confirm Password</label>

            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm Password">

            <span id="confirmPasswordError"
                  class="error-message"></span>


            <!-- Register Button -->

            <button type="button"
                    onclick="registerAdmin()">

                Register Admin

            </button>


            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <button type="button"
                    onclick="goHome()">

                🏠 Home

            </button>

        </div>

    </div>


    <script src="../JS/adminRegister.js"></script>

</body>

</html>
