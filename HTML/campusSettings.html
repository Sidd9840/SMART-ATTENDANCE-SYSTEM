<!DOCTYPE html>
<html>

<head>

    <title>Campus Settings</title>

    <link rel="stylesheet" href="../CSS/campusSettings.css">

</head>

<body>

<div class="hero">

    <div class="content">

        <h1>📍 Campus Settings</h1>

        <p>Update Campus Geo Location</p>

        <div class="form">

            <input
                type="text"
                id="campusName"
                placeholder="Campus Name">

           

            <input
                type="number"
                id="allowedDistance"
                placeholder="Allowed Distance (Meter)">

            <button onclick="saveCampusLocation()">

                💾 Save

            </button>

            <button class="back-btn" onclick="goBack()">

                🔙 Back

            </button>

        </div>

    </div>

</div>

<script src="../JS/campusSettings.js"></script>

</body>

</html>
