<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet" href="../CSS/addStudent.css">

</head>

<body>

<div class="hero">

    <div class="content">

        <h1>Add Student</h1>

        <p>Enter Student Details</p>

        <form id="studentForm" class="loginForm">

            <input
                type="text"
                id="studentName"
                placeholder="Student Name"
                required>

            <span id="nameError" class="error"></span>

            <input
                type="text"
                id="rollNo"
                placeholder="Roll Number"
                required>

            <span id="rollError" class="error"></span>

            <input
                type="text"
                id="course"
                placeholder="Course"
                required>

            <span id="courseError" class="error"></span>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <span id="emailError" class="error"></span>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <span id="passwordError" class="error"></span>

            <button type="submit">

                Add Student

            </button>

        </form>

        <div class="buttons">

            <a href="studentList.html">

                <button type="button">

                    📋 Student List

                </button>

            </a>

            <a href="adminDashboard.html">

                <button type="button">

                    ⬅ Back

                </button>

            </a>

        </div>

    </div>

</div>

<script src="../JS/addStudent.js"></script>

</body>

</html>
