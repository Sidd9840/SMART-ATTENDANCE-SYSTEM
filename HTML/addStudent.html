<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet" href="../CSS/addStudent.css">

</head>

<body>

<div class="container">

<div class="card">

<h1>Add Student</h1>

<p>Enter Student Details</p>

<form id="studentForm">

<input
type="text"
id="studentName"
placeholder="Student Name"
required>

<span id="nameError" class="error"></span>

<input
type="text"
id="rollNo"
placeholder="Roll Number"
required>

<span id="rollError" class="error"></span>

<input
type="text"
id="course"
placeholder="Course"
required>

<span id="courseError" class="error"></span>

<input
type="email"
id="email"
placeholder="Email"
required>

<span id="emailError" class="error"></span>

<input
type="password"
id="password"
placeholder="Password"
required>

<span id="passwordError" class="error"></span>

<button
type="submit"
class="btn">

Add Student

</button>

</form>

<button
class="back-btn"
onclick="goBack()">

Back to Dashboard

</button>

</div>

</div>

<script src="../JS/addStudent.js"></script>

</body>

</html>
