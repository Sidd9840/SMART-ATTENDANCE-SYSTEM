<!DOCTYPE html>
<html>

<head>

    <title>Add Student</title>

    <link rel="stylesheet" href="../CSS/addStudent.css">

</head>

<body>

<div class="hero">

<div class="content">

<h1>Add Student</h1>

<p>Create New Student Account</p>

<form id="studentForm">

<div class="loginForm">

<input
type="text"
id="studentName"
placeholder="Enter Student Name"
required>

<span id="nameError" class="error"></span>

<input
type="text"
id="rollNo"
placeholder="Enter Roll Number"
required>

<span id="rollError" class="error"></span>

<input
type="text"
id="course"
placeholder="Enter Course"
required>

<span id="courseError" class="error"></span>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<span id="emailError" class="error"></span>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<span id="passwordError" class="error"></span>

<button type="submit">

Save Student

</button>

</div>

</form>

<br>

<div class="buttons">

<a href="studentList.html">

<button type="button">

📋 Student List

</button>

</a>

<a href="adminDashboard.html">

<button type="button">

⬅ Back

</button>

</a>

</div>

</div>

</div>

<script src="../JS/addStudent.js"></script>

</body>

</html>
