<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet" href="../CSS/style1.css">

</head>

<body>

<div class="hero">

<div class="content">

<h1>Add Student</h1>

<p>Enter Student Details</p>

<form id="studentForm">

<input
type="text"
id="studentName"
placeholder="Student Name">

<span id="nameError" class="error"></span>

<input
type="text"
id="rollNo"
placeholder="Roll Number">

<span id="rollError" class="error"></span>

<input
type="text"
id="course"
placeholder="Course">

<span id="courseError" class="error"></span>

<input
type="email"
id="email"
placeholder="Email">

<span id="emailError" class="error"></span>

<input
type="password"
id="password"
placeholder="Password">

<span id="passwordError" class="error"></span>

<div class="buttons">

<button type="submit">

Add Student

</button>

</div>

</form>

<div class="buttons">

<button
type="button"
onclick="goBack()">

Back to Dashboard

</button>

</div>

</div>

</div>

<script src="../JS/addStudent.js"></script>

</body>

</html>
