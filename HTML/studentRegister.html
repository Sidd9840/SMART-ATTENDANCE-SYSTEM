<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <link rel="stylesheet" href="../CSS/style1.css">

</head>

<body>

<div class="hero">

<div class="content">

<h1>Student Registration</h1>

<p>Complete Your Registration</p>

<input
type="text"
id="name"
placeholder="Name"
readonly>

<input
type="email"
id="email"
placeholder="Email"
readonly>

<input
type="text"
id="rollNo"
placeholder="Roll Number">

<span id="rollError" class="error"></span>

<input
type="text"
id="course"
placeholder="Course">

<span id="courseError" class="error"></span>

<div class="buttons">

<button
type="button"
onclick="registerStudent()">

Register

</button>

</div>

<br>

<a href="register.html">

Back

</a>

</div>

</div>

<script src="../JS/studentRegister.js"></script>

</body>

</html>
