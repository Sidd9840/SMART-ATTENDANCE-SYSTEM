<!DOCTYPE html>
<html>

<head>

    <title>Teacher Registration</title>

    <link rel="stylesheet" href="../CSS/teacherRegister.css">

</head>

<body>

<div class="hero">

<div class="content">

<h1>Teacher Registration</h1>

<div class="loginForm">

<input
type="text"
id="name"
placeholder="Teacher Name">

<span id="nameError" class="error"></span>

<input
type="text"
id="employeeId"
placeholder="Employee ID">

<span id="employeeIdError" class="error"></span>

<input
type="text"
id="subject"
placeholder="Subject">

<span id="subjectError" class="error"></span>

<input
type="text"
id="department"
placeholder="Department">

<span id="departmentError" class="error"></span>

<input
type="text"
id="phone"
placeholder="Phone Number">

<span id="phoneError" class="error"></span>

<input
type="email"
id="email"
placeholder="Email">

<span id="emailError" class="error"></span>

<input
type="password"
id="password"
placeholder="Password">

<span id="passwordError" class="error"></span>

<div class="buttons">

<button onclick="registerTeacher()">

Register

</button>

</div>

<div class="buttons">

<a href="teacherLogin.html">

<button type="button">

Back to Login

</button>

</a>

</div>

</div>

</div>

</div>

<script src="../JS/teacherRegister.js"></script>

</body>

</html>
