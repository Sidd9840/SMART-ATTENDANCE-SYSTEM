<!DOCTYPE html>
<html>

<head>

    <title>Add Teacher</title>

    <link rel="stylesheet" href="../CSS/style1.css">

</head>

<body>

<div class="hero">

    <div class="content">

        <h1>Add Teacher</h1>

        <p>Create New Teacher Account</p>

        <div class="loginForm">

            <input
                type="text"
                id="name"
                placeholder="Enter Teacher Name">

            <input
                type="text"
                id="employeeId"
                placeholder="Enter Employee ID">

            <input
                type="email"
                id="email"
                placeholder="Enter Email">

            <input
                type="password"
                id="password"
                placeholder="Enter Password">

            <input
                type="text"
                id="phone"
                placeholder="Enter Phone Number">

            <input
                type="text"
                id="department"
                placeholder="Enter Department">

            <input
                type="text"
                id="subject"
                placeholder="Enter Subject">

            <button onclick="saveTeacher()">

                Save Teacher

            </button>

        </div>

        <br>

        <div class="buttons">

            <a href="teacherList.html">

                <button>

                    📋 Teacher List

                </button>

            </a>

            <a href="adminDashboard.html">

                <button>

                    ⬅ Back

                </button>

            </a>

        </div>

    </div>

</div>

<script src="../JS/addTeacher.js"></script>

</body>

</html>
