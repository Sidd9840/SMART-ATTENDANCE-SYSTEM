<!DOCTYPE html>
<html>

<head>

    <title>Add Teacher</title>

    <link rel="stylesheet" href="../CSS/addTeacher.css">

</head>

<body>

<div class="hero">

<div class="content">

<h1>Add Teacher</h1>

<p>Create New Teacher Account</p>

<div class="loginForm">

<input
type="text"
id="name"
placeholder="Enter Teacher Name">

<span id="nameError" class="error"></span>

<input
type="text"
id="employeeId"
placeholder="Enter Employee ID">

<span id="employeeIdError" class="error"></span>

<input
type="email"
id="email"
placeholder="Enter Email">

<span id="emailError" class="error"></span>

<input
type="password"
id="password"
placeholder="Enter Password">

<span id="passwordError" class="error"></span>

<input
type="text"
id="phone"
placeholder="Enter Phone Number">

<span id="phoneError" class="error"></span>

<input
type="text"
id="department"
placeholder="Enter Department">

<span id="departmentError" class="error"></span>

<input
type="text"
id="subject"
placeholder="Enter Subject">

<span id="subjectError" class="error"></span>

<button onclick="saveTeacher()">

Save Teacher

</button>

</div>

<br>

<div class="buttons">

<a href="teacherList.html">

<button type="button">

📋 Teacher List

</button>

</a>

<a href="adminDashboard.html">

<button type="button">

⬅ Back

</button>

</a>

</div>

</div>

</div>

<script src="../JS/addTeacher.js"></script>

</body>

</html>
