<!DOCTYPE html>
<html>

<head>

    <title>Edit Teacher</title>

    <link rel="stylesheet" href="../CSS/editTeacher.css">

</head>

<body>

<div class="hero">

<div class="content">

<h1>Edit Teacher</h1>

<p>Update Teacher Details</p>

<div class="loginForm">

<input
type="text"
id="name"
placeholder="Teacher Name">

<span id="nameError" class="error"></span>

<input
type="text"
id="employeeId"
placeholder="Employee ID">

<span id="employeeIdError" class="error"></span>

<input
type="email"
id="email"
placeholder="Email">

<span id="emailError" class="error"></span>

<input
type="password"
id="password"
placeholder="Password">

<span id="passwordError" class="error"></span>

<input
type="text"
id="phone"
placeholder="Phone Number">

<span id="phoneError" class="error"></span>

<input
type="text"
id="department"
placeholder="Department">

<span id="departmentError" class="error"></span>

<input
type="text"
id="subject"
placeholder="Subject">

<span id="subjectError" class="error"></span>

<button onclick="updateTeacher()">

Update Teacher

</button>

</div>

<br>

<div class="buttons">

<a href="teacherList.html">

<button type="button">

⬅ Back

</button>

</a>

</div>

</div>

</div>

<script src="../JS/editTeacher.js"></script>

</body>

</html>
