<!DOCTYPE html>
<html>

<head>

    <title>Edit Teacher</title>

    <link rel="stylesheet" href="../CSS/style1.css">

</head>

<body>

<div class="hero">

    <div class="content">

        <h1>Edit Teacher</h1>

        <p>Update Teacher Details</p>

        <div class="loginForm">

            <input
                type="text"
                id="name"
                placeholder="Teacher Name">

            <input
                type="text"
                id="employeeId"
                placeholder="Employee ID">

            <input
                type="email"
                id="email"
                placeholder="Email">

            <input
                type="password"
                id="password"
                placeholder="Password">

            <input
                type="text"
                id="phone"
                placeholder="Phone Number">

            <input
                type="text"
                id="department"
                placeholder="Department">

            <input
                type="text"
                id="subject"
                placeholder="Subject">

            <button onclick="updateTeacher()">

                Update Teacher

            </button>

        </div>

        <br>

        <div class="buttons">

            <a href="teacherList.html">

                <button>

                    ⬅ Back

                </button>

            </a>

        </div>

    </div>

</div>

<script src="../JS/editTeacher.js"></script>

</body>

</html>
