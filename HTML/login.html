<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="../CSS/style1.css">

</head>

<body>

<div class="hero">

    <div class="content">

        <h1>Login</h1>

        <p>Login to Smart Attendance System</p>

        <div class="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Enter Email">

            <input
                type="password"
                id="password"
                placeholder="Enter Password">

            <select id="role">

                <option value="">Select Role</option>

                <option value="Admin">
                    Admin
                </option>

                <option value="Teacher">
                    Teacher
                </option>

                <option value="Student">
                    Student
                </option>

            </select>

            <button onclick="login()">
                Login
            </button>

        </div>

        <br>

        <a href="register.html">
            Don't have an account? Register
        </a>

    </div>
<div class="buttons">

    <button type="button" onclick="goHome()">

        🏠 Home

    </button>

</div>
</div>

<script src="../JS/login.js"></script>

</body>

</html>
